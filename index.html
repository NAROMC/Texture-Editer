<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Texture Studio</title>
<style>
:root{
  --bg:#111318;--panel:#181b22;--panel2:#20242d;--border:#303642;
  --text:#eef1f6;--muted:#929aaa;--accent:#6d7cff;--accent2:#5363e8;
  --danger:#e65b70;--good:#56c596;
}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI","Noto Sans JP",sans-serif}
button,input,select{font:inherit}
button{border:1px solid var(--border);background:#242934;color:var(--text);border-radius:7px;padding:7px 11px;cursor:pointer;white-space:nowrap}
button:hover{background:#2d3340;border-color:#414957}
button.active{background:var(--accent2);border-color:#7784ff}
button.primary{background:var(--accent);border-color:var(--accent);font-weight:700}
button.danger{color:#ff9aaa}
input[type=file]{display:none}
.app{height:100vh;display:flex;flex-direction:column;min-height:0}
.topbar{height:52px;flex:0 0 52px;display:flex;align-items:center;gap:9px;padding:7px 10px;background:#15171d;border-bottom:1px solid var(--border)}
.logo{font-size:18px;font-weight:800;letter-spacing:.2px;margin-right:auto}
.logo span{color:#8995ff}
.top-actions{display:flex;align-items:center;gap:7px}
.zoom-box{display:flex;align-items:center;gap:6px;border:1px solid var(--border);background:#1d2027;padding:5px 8px;border-radius:7px}
.zoom-box input{width:115px}
#zoomLabel{width:43px;text-align:right;font-size:12px;color:#b9c0cc}
.toolbar{display:flex;gap:7px;padding:7px 10px;background:#191c23;border-bottom:1px solid var(--border);overflow-x:auto;flex:0 0 45px}
.toolbar button{padding:6px 10px}
.toolbar .group-label{font-size:11px;color:#747d8c;align-self:center;margin-left:5px}
.drawbar{display:flex;align-items:center;gap:7px;padding:7px 10px;background:#14171d;border-bottom:1px solid var(--border);flex:0 0 43px}
.parambar{min-height:76px;flex:0 0 auto;background:#1b1e26;border-bottom:1px solid var(--border);padding:8px 12px;display:flex;align-items:center;gap:14px;overflow-x:auto}
.param-title{font-weight:700;color:#dbe0ea;margin-right:5px}
.param-item{display:flex;align-items:center;gap:7px;white-space:nowrap}
.param-item label{font-size:12px;color:#aeb5c1}
.param-item input[type=range]{width:145px}
.val{font-variant-numeric:tabular-nums;color:#fff;font-size:12px;width:56px;text-align:right;background:#20242d;border:1px solid var(--border);border-radius:5px;padding:4px 5px;-moz-appearance:textfield}
.val::-webkit-outer-spin-button,.val::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.color-input{width:34px;height:30px;padding:2px;border:1px solid var(--border);border-radius:6px;background:#252a33}
.hex-input{width:76px;background:#20242d;border:1px solid var(--border);color:var(--text);border-radius:6px;padding:5px 6px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px}
.hex-input:focus{outline:none;border-color:var(--accent)}
.workspace{display:grid;grid-template-columns:230px minmax(0,1fr);flex:1;min-height:0}
.sidebar{min-height:0;border-right:1px solid var(--border);background:#15181e;display:flex;flex-direction:column}
.sidebar-head{padding:10px;border-bottom:1px solid var(--border);font-size:13px;color:#b9c0cc;display:flex;justify-content:space-between}
.file-list{overflow:auto;min-height:0;flex:1;padding:8px;scrollbar-color:#2a3866 #11141a;scrollbar-width:thin;position:relative}
.file-drag-box{position:absolute;border:1px dashed #4c8bf5;background:#4c8bf52a;pointer-events:none;display:none;z-index:5}
.ctx-menu{position:fixed;z-index:50;background:#20242dee;border:1px solid #3a4256;border-radius:8px;padding:4px;box-shadow:0 10px 30px #000a;min-width:170px}
.ctx-menu button{display:block;width:100%;text-align:left;background:transparent;border:none;padding:8px 10px;border-radius:5px;color:var(--text)}
.ctx-menu button:hover{background:#2d3340}
.ctx-menu hr{border:none;border-top:1px solid #3a4256;margin:4px 0}
.resize-handles{position:absolute;left:0;top:0;pointer-events:none;display:none}
.resize-handle{position:absolute;width:7px;height:7px;background:#4c8bf5dd;border:1px solid #dfe6ff;border-radius:2px;pointer-events:auto;z-index:6}
.resize-handle:hover{background:#7ea0ffee}
.resize-handle[data-dir="n"],.resize-handle[data-dir="s"]{cursor:ns-resize}
.resize-handle[data-dir="e"],.resize-handle[data-dir="w"]{cursor:ew-resize}
.resize-handle[data-dir="ne"],.resize-handle[data-dir="sw"]{cursor:nesw-resize}
.resize-handle[data-dir="nw"],.resize-handle[data-dir="se"]{cursor:nwse-resize}
 .resize-outline{position:absolute;left:0;top:0;border:1px dashed #4c8bf5;pointer-events:none;display:none;z-index:7}
.selection-resize-handles{position:absolute;left:0;top:0;pointer-events:none;display:none;z-index:12}
.selection-resize-handle{position:absolute;width:9px;height:9px;background:#4c8bf5;border:1px solid #fff;border-radius:2px;pointer-events:auto;box-shadow:0 0 0 1px #1118}
.selection-resize-handle[data-dir="n"],.selection-resize-handle[data-dir="s"]{cursor:ns-resize}
.selection-resize-handle[data-dir="e"],.selection-resize-handle[data-dir="w"]{cursor:ew-resize}
.selection-resize-handle[data-dir="ne"],.selection-resize-handle[data-dir="sw"]{cursor:nesw-resize}
.selection-resize-handle[data-dir="nw"],.selection-resize-handle[data-dir="se"]{cursor:nwse-resize}
.text-layer-hit{cursor:move}
.file-list::-webkit-scrollbar{width:10px}
.file-list::-webkit-scrollbar-track{background:#11141a}
.file-list::-webkit-scrollbar-thumb{background:#2a3866;border-radius:6px;border:2px solid #11141a}
.file-list::-webkit-scrollbar-thumb:hover{background:#37478c}
.canvas-wrap{scrollbar-color:#2a3866 #11141a;scrollbar-width:thin}
.canvas-wrap::-webkit-scrollbar{width:10px;height:10px}
.canvas-wrap::-webkit-scrollbar-track{background:#11141a}
.canvas-wrap::-webkit-scrollbar-thumb{background:#2a3866;border-radius:6px;border:2px solid #11141a}
.canvas-wrap::-webkit-scrollbar-thumb:hover{background:#37478c}
.canvas-wrap::-webkit-scrollbar-corner{background:#11141a}
.search-box{position:relative;margin-top:8px}
.search-box input{width:100%;background:#20242d;border:1px solid var(--border);color:var(--text);border-radius:6px;padding:6px 26px 6px 8px;font-size:12px}
.search-box input:focus{outline:none;border-color:var(--accent)}
.search-clear{position:absolute;right:3px;top:50%;transform:translateY(-50%);width:20px;height:20px;padding:0;line-height:1;border:none;background:transparent;color:#aab2c3;border-radius:4px;font-size:15px}
.search-clear:hover{background:#2d3340;color:#fff}
.thumb{height:72px;margin-bottom:7px;border:1px solid #2d333e;border-radius:7px;background:#1c2027;display:flex;align-items:center;gap:8px;padding:6px;cursor:pointer;position:relative}
.thumb.batch-checked{border-color:#4c8bf5;background:#182238;box-shadow:0 0 0 1px #4c8bf5 inset}
.thumb:hover{border-color:#4a5363}
.thumb.selected{border-color:var(--accent);box-shadow:0 0 0 1px #5968ee44 inset}
.thumb input{accent-color:var(--accent)}
.thumb canvas{width:58px;height:58px;object-fit:contain;image-rendering:pixelated;background-color:#d0d0d0;background-image:linear-gradient(45deg,#bbb 25%,transparent 25%),linear-gradient(-45deg,#bbb 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#bbb 75%),linear-gradient(-45deg,transparent 75%,#bbb 75%);background-size:12px 12px;background-position:0 0,0 6px,6px -6px,-6px 0}
.thumb-name{font-size:11px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#d5d9e0;flex:1}
.folder-head{display:flex;align-items:center;gap:6px;padding:8px 4px 6px;font-size:11px;color:#8b93a3;font-weight:600;white-space:nowrap;overflow:hidden;border-top:1px solid #2d333e;margin-top:4px;cursor:pointer;border-radius:5px}
.folder-head:hover{background:#1a1f2b}
.folder-head.drop-target{background:#22325f;outline:1px dashed #6d8cff;color:#dfe6ff}
.folder-head .fh-toggle{flex:0 0 auto;width:16px;height:16px;display:inline-flex;align-items:center;justify-content:center;color:#aab2c3;font-weight:800;font-size:12px;line-height:1;transition:transform .12s}
.folder-head.expanded .fh-toggle{transform:rotate(90deg)}
.folder-head .fh-name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis}
.folder-head .fh-count{flex:0 0 auto;font-weight:400;color:#697181}
.folder-head input{flex:0 0 auto;accent-color:var(--accent);margin:0}
.file-list{user-select:none;-webkit-user-select:none}
.sort-row{display:flex;align-items:center;gap:6px;margin-top:8px;font-size:12px;color:#aeb5c1}
.sort-row label{flex:0 0 auto}
.sort-row select{flex:1;min-width:0;padding:5px 6px;font-size:12px}
.thumb-folder{font-size:10px;color:#697181;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.drag-ghost{position:fixed;z-index:200;pointer-events:none;opacity:.5;display:flex;align-items:center;gap:8px;padding:6px;height:72px;border:1px solid var(--accent);border-radius:7px;background:#1c2027;box-shadow:0 8px 24px #0008}
.drag-ghost canvas{width:58px;height:58px;image-rendering:pixelated;background-color:#d0d0d0}
.drag-ghost .dg-name{font-size:11px;color:#d5d9e0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
.drag-ghost .dg-count{position:absolute;right:-6px;top:-8px;background:var(--accent);color:#fff;border-radius:10px;font-size:11px;font-weight:700;padding:2px 7px}
.brush-preview-clip{position:absolute;overflow:hidden;pointer-events:none;display:none;z-index:3}
.brush-preview{position:absolute;pointer-events:none;box-shadow:0 0 0 1px rgba(0,0,0,.6),0 0 0 2px rgba(255,255,255,.35)}
.ui-overlay{position:fixed;inset:0;z-index:300;background:#050814b3;display:flex;align-items:center;justify-content:center}
.ui-dialog{width:min(440px,92vw);background:#141b3d;border:1px solid #33417c;border-radius:12px;padding:18px 20px;box-shadow:0 20px 60px #000c;color:#e8ecff}
.ui-dialog h3{margin:0 0 12px;font-size:16px}
.ui-dialog p{margin:0;font-size:13px;line-height:1.7;color:#c3cbee;white-space:pre-line}
.ui-dialog .ui-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}
.ui-dialog button{background:#1f2a5a;border-color:#3a4a8f;color:#e8ecff}
.ui-dialog button:hover{background:#2a3874;border-color:#5566b5}
.ui-dialog button.primary{background:var(--accent);border-color:var(--accent)}
.ui-dialog button.primary:hover{background:#7f8cff}
.ui-dialog button.danger{background:#b3364d;border-color:#d0546b;color:#fff}
.ui-dialog button.danger:hover{background:#c9435b}
.ui-choice{display:block;width:100%;text-align:left;padding:12px 14px;margin-bottom:10px;border-radius:9px;white-space:normal}
.ui-choice b{display:block;font-size:14px;margin-bottom:3px}
.ui-choice span{font-size:12px;color:#aab4e6;font-weight:400}
.ui-card{background:#1a2350;border:1px solid #3a4a8f;border-radius:9px;padding:12px 14px}
.ui-card b{display:block;font-size:14px;margin-bottom:3px}
.ui-card .ui-desc{font-size:12px;color:#aab4e6;margin-bottom:8px}
.ui-size{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.ui-dialog input[type=number]{width:84px;background:#0e1430;border:1px solid #33417c;color:#fff;border-radius:6px;padding:6px 8px}
.ui-dialog input[type=number]:focus{outline:none;border-color:var(--accent)}
.ui-error{color:#ff9aaa;font-size:12px;min-height:16px;margin-top:6px}
.folder-head:first-child{border-top:none;margin-top:0}
.empty{padding:25px 12px;text-align:center;color:#697181;font-size:12px;line-height:1.7}
.thumb-info{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:center;gap:3px}
.thumb-badges{display:flex;gap:3px;flex-wrap:wrap;min-height:14px}
.thumb-badge{font-size:10px;line-height:1;padding:2px 4px;border-radius:4px;background:#2a3040;border:1px solid #3a4256;color:#c7cee0}
.effects-bar{display:none;gap:6px;padding:6px 12px;background:#171a21;border-bottom:1px solid var(--border);overflow-x:auto;align-items:center;flex:0 0 auto}
.effect-chip{background:#232838;border:1px solid #3a4256;color:#c7cee0;font-size:11px;padding:3px 9px;border-radius:12px;white-space:nowrap;flex:0 0 auto}
.editor{min-width:0;min-height:0;display:flex;flex-direction:column;background:#0f1115}
.canvas-wrap{flex:1;min-height:0;display:flex;overflow:auto;position:relative;background:var(--bg);padding:44px}
#mainCanvas{flex:none;margin:auto;image-rendering:pixelated;image-rendering:crisp-edges;box-shadow:0 10px 40px #0008;cursor:crosshair;background-color:#d0d0d0;background-image:linear-gradient(45deg,#bbb 25%,transparent 25%),linear-gradient(-45deg,#bbb 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#bbb 75%),linear-gradient(-45deg,transparent 75%,#bbb 75%);background-size:16px 16px;background-position:0 0,0 8px,8px -8px,-8px 0}
.status{position:absolute;left:10px;top:9px;background:#11151ccc;border:1px solid #3a414e;border-radius:6px;padding:5px 8px;color:#b7beca;font-size:11px;pointer-events:none}
.selection-box{position:absolute;border:1px dashed #fff;outline:1px dashed #111;pointer-events:none;display:none}
.floatbar{position:absolute;z-index:5;display:none;gap:5px;background:#171a21ee;border:1px solid #454d5b;padding:6px;border-radius:8px;box-shadow:0 8px 25px #0009}
.floatbar button{font-size:12px;padding:5px 8px}
.floatbar .float-quality{display:none;align-items:center;gap:4px;font-size:12px;color:#aeb5c1;white-space:nowrap}
.floatbar .float-quality select{font-size:12px;padding:4px 6px}
#opacityPanel{align-items:center;gap:8px;padding:7px 10px}
#opacityPanel label{font-size:12px;color:#aeb5c1;white-space:nowrap}
#opacityPanel input[type=range]{width:160px}
#opacityPanel .val{width:52px}
#opacityPanel .unit{font-size:12px;color:#aeb5c1}
.hsv{display:flex;align-items:center;gap:8px}
#satVal{width:125px;height:72px;border-radius:5px;cursor:crosshair;display:block}
#hue{width:125px}
.swatches{display:flex;gap:4px;align-items:center;max-width:260px;overflow:auto}
.swatch{width:22px;height:22px;border:1px solid #555;border-radius:4px;cursor:pointer;flex:0 0 auto}
.check{display:flex;align-items:center;gap:5px;font-size:12px}
.small{font-size:11px;color:var(--muted)}
select{background:#242934;color:var(--text);border:1px solid var(--border);border-radius:6px;padding:6px}
/* フォント設定をコンパクトに整理 */
.font-panel{display:grid;grid-template-columns:minmax(260px,1.15fr) minmax(230px,1fr) minmax(210px,.9fr) minmax(230px,1fr);gap:7px;align-items:stretch;width:max-content;min-width:100%}
.font-group{min-width:0;background:#20242d;border:1px solid #303642;border-radius:7px;padding:6px 8px;display:flex;flex-wrap:wrap;align-content:flex-start;align-items:center;gap:5px 8px}
.font-group-title{flex:0 0 100%;font-size:11px;line-height:1.2;font-weight:700;color:#dbe0ea;padding-bottom:2px}
.font-row{display:flex;align-items:center;gap:5px;min-width:0;white-space:nowrap}
.font-row label,.font-group .check{font-size:11px;color:#aeb5c1;white-space:nowrap}
.font-row select{height:29px;padding:4px 6px;font-size:11px;max-width:135px}
.font-row input[type="range"]{width:78px}
.font-row .val{width:44px;padding:3px 4px}
.font-row .color-input{width:29px;height:28px}
.font-panel .check{display:flex;align-items:center;gap:4px;white-space:nowrap}
.font-panel .font-help{grid-column:1 / -1;display:flex;align-items:center;gap:8px;font-size:11px;color:#929aaa}
.font-panel .font-help .primary{padding:5px 10px;font-size:12px}
.font-panel .font-text-input{width:105px!important}
.font-panel .param-item{gap:5px}.font-panel .param-item label{font-size:11px}
.toolbar,.drawbar,.parambar,.effects-bar{scrollbar-color:#2a3866 #11141a;scrollbar-width:thin}
.toolbar::-webkit-scrollbar,.drawbar::-webkit-scrollbar,.parambar::-webkit-scrollbar,.effects-bar::-webkit-scrollbar{height:8px}
.toolbar::-webkit-scrollbar-track,.drawbar::-webkit-scrollbar-track,.parambar::-webkit-scrollbar-track,.effects-bar::-webkit-scrollbar-track{background:#11141a}
.toolbar::-webkit-scrollbar-thumb,.drawbar::-webkit-scrollbar-thumb,.parambar::-webkit-scrollbar-thumb,.effects-bar::-webkit-scrollbar-thumb{background:#2a3866;border-radius:6px}
.toolbar::-webkit-scrollbar-thumb:hover,.drawbar::-webkit-scrollbar-thumb:hover,.parambar::-webkit-scrollbar-thumb:hover,.effects-bar::-webkit-scrollbar-thumb:hover{background:#37478c}
@media(max-width:1100px){.font-panel{grid-template-columns:repeat(2,minmax(270px,1fr));min-width:540px}}
@media(max-width:700px){.font-panel{grid-template-columns:1fr;min-width:330px}}
@media(max-width:900px){
 .topbar{overflow-x:auto}.logo{margin-right:0}.workspace{grid-template-columns:190px 1fr}
 .parambar{gap:8px}.sidebar{min-width:190px}
}

/* =========================================================
   Responsive UI: PC / Tablet / Smartphone
   既存の編集ロジック・ID・レイアウト構造を変更せず、
   画面幅に応じて操作領域とキャンバス領域だけを最適化。
   ========================================================= */
button,
select,
input[type="range"]{touch-action:manipulation}

/* タブレット～小型ノート: 固定幅を減らし、各バーを横スクロール可能にする */
@media (max-width:1100px){
  .topbar{overflow-x:auto;overflow-y:hidden;flex-wrap:nowrap}
  .top-actions{flex:0 0 max-content}
  .toolbar,.drawbar,.parambar{overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch}
  .workspace{grid-template-columns:200px minmax(0,1fr)}
  .canvas-wrap{padding:28px}
}

/* タブレット: PC版の密度が高すぎないよう、操作部品を少し大きくする。
   既存の横スクロール構造は維持し、機能やIDは変更しない。 */
@media (min-width:701px) and (max-width:1100px){
  .topbar{height:60px;flex-basis:60px;padding:8px 12px;gap:10px}
  .logo{font-size:20px}
  .top-actions{gap:8px}
  .topbar button{min-height:42px;padding:8px 12px;font-size:14px}
  .zoom-box{min-height:42px;padding:6px 9px;gap:7px}
  .zoom-box input{width:130px}
  .toolbar{flex-basis:50px;min-height:50px;padding:8px 12px;gap:8px}
  .toolbar button{min-height:38px;padding:8px 12px;font-size:14px}
  .drawbar{flex-basis:48px;min-height:48px;padding:8px 12px;gap:8px}
  .drawbar button{min-height:38px;padding:8px 12px;font-size:14px}
  .parambar{min-height:88px;padding:10px 14px;gap:16px}
  .param-title{font-size:14px}
  .param-item{gap:8px}
  .param-item label{font-size:13px}
  .param-item input[type=range]{width:155px}
  .val{width:60px;font-size:13px;padding:5px 6px}
  .color-input{width:38px;height:34px}
  .hex-input{width:84px;min-height:34px;font-size:13px}
  .sidebar-head{font-size:14px;padding:11px}
  .thumb{height:78px;padding:7px;gap:9px}
  .thumb canvas{width:62px;height:62px}
  .thumb-name{font-size:12px}
  .search-box input,.sort-row select{min-height:36px;font-size:13px}
  .canvas-wrap{padding:30px}
}

/* スマートフォン: 横幅が狭くても操作対象を押しやすくし、
   キャンバスにできるだけ広い領域を確保する */
@media (max-width:700px){
  html,body{min-width:0;overflow:hidden;overscroll-behavior:none}

  /* スマホでは画像一覧を編集領域の横幅から切り離し、
     必要なときだけ引き出せるドロワーにする。 */
  .workspace{position:relative;display:block;min-width:0}
  .editor{position:absolute;inset:0;min-width:0;width:100%}
  .sidebar{position:absolute;z-index:40;left:0;top:0;bottom:0;width:min(280px,86vw);min-width:0;border-right:1px solid var(--border);
    box-shadow:12px 0 35px #0009;transform:translateX(-105%);transition:transform .18s ease;
    pointer-events:none}
  .sidebar.mobile-open{transform:translateX(0);pointer-events:auto}
  .mobile-sidebar-toggle{position:absolute;z-index:35;left:8px;top:8px;min-height:36px;padding:7px 10px;
    background:#171a21ee;border:1px solid #454d5b;border-radius:7px;box-shadow:0 5px 18px #0008}
  .mobile-sidebar-toggle{z-index:45}
  .mobile-sidebar-toggle.is-open{left:min(280px,86vw);transform:none;border-radius:0 7px 7px 0}
  .sidebar-head{cursor:pointer}
  .topbar{
    height:46px;
    flex:0 0 46px;
    padding:5px 7px;
    gap:6px;
    scrollbar-width:none;
  }
  .topbar::-webkit-scrollbar{display:none}
  .logo{font-size:16px;flex:0 0 auto;margin-right:2px}
  .top-actions{gap:6px}
  .topbar button{min-height:32px;padding:5px 8px;font-size:12px}
  .zoom-box{min-height:32px;padding:4px 6px;gap:5px}
  .zoom-box input{width:88px}

// 文字の描画。scaleX/scaleY(選択枠のハンドルでの拡大縮小)を反映する。
//  ・scaleQuality==="pixel": 等倍で描いた文字をニアレストネイバーで拡大縮小(ドット感を保つ)
//  ・それ以外(smooth): ベクターのまま拡大縮小(なめらか)
function drawTextObject(ctx,t,selected=false){
 if(!t||!t.text)return;

 ctx.translate(dw/2,dh/2);
 ctx.rotate((t.rotation||0)*Math.PI/180);
 ctx.scale(t.flipH?-1:1,t.flipV?-1:1);
 ctx.translate(-dw/2,-dh/2);
 ctx.scale(sx,sy);

 else if(t.filter==="セピア")ctx.filter="sepia(1)";
 else if(t.filter==="反転")ctx.filter="invert(1)";
 else if(t.filter==="明るく")ctx.filter=`brightness(${t.brightness||100}%)`;

   const tc=document.createElement("canvas");tc.width=Math.max(1,m.w);tc.height=Math.max(1,m.h);
   drawTextBody(tc.getContext("2d"),t,m,1);
   ctx.globalAlpha=alpha;

   drawTextBody(ctx,t,m,alpha);

function openDialog({title,message,content,actions,onEnter,onReady}){

  const ov=document.createElement("div");ov.className="ui-overlay";
  const box=document.createElement("div");box.className="ui-dialog";box.setAttribute("role","dialog");box.setAttribute("aria-modal","true");
  if(title){const h=document.createElement("h3");h.textContent=title;box.appendChild(h)}
  if(message){const pp=document.createElement("p");pp.textContent=message;box.appendChild(pp)}
  if(content)box.appendChild(content);
  let done=false;
  const onKey=e=>{
   if(e.key==="Escape"){e.preventDefault();e.stopPropagation();close(null)}
   else if(e.key==="Enter"&&onEnter&&e.target.tagName!=="BUTTON"){e.preventDefault();onEnter(close)}
  };
  const close=v=>{if(done)return;done=true;window.removeEventListener("keydown",onKey,true);ov.remove();resolve(v)};
  (actions||[]).length&&(()=>{
   const bar=document.createElement("div");bar.className="ui-actions";
   actions.forEach(a=>{
    const b=document.createElement("button");b.type="button";b.textContent=a.label;if(a.cls)b.className=a.cls;
    b.addEventListener("click",()=>close(a.value));
    bar.appendChild(b);
   });
   box.appendChild(bar);
  })();
  window.addEventListener("keydown",onKey,true);
  ov.addEventListener("pointerdown",e=>{if(e.target===ov)close(null)});
  ov.appendChild(box);document.body.appendChild(ov);
  const first=box.querySelector("input,button");if(first)first.focus();
  if(onReady)onReady(close);
 });
}

function readAllEntries(reader){

async function collectEntryFiles(entry,path,out){

  const file=await new Promise((res,rej)=>entry.file(res,rej));
  out.push({file,folder:path});

  const kids=await readAllEntries(entry.createReader());
  const sub=path?path+"/"+entry.name:entry.name;
  for(const k of kids)await collectEntryFiles(k,sub,out);

}
async function handleDroppedFiles(entries,plain){

   await addFiles(list.map(x=>x.file),folderOf);
  }else if(plain.length){

function hsvToRgb(h,s,v){
 s/=100;v/=100;let f=(n,k=(n+h/60)%6)=>v-v*s*Math.max(Math.min(k,4-k,1),0);

function rgbToHex(r,g,b){return "#"+[r,g,b].map(v=>v.toString(16).padStart(2,"0")).join("")}
function rgbToHsl(r,g,b){
 r/=255;g/=255;b/=255;
 const max=Math.max(r,g,b),min=Math.min(r,g,b);
 let h,s,l=(max+min)/2;
 if(max===min){h=s=0}
 else{
  const d=max-min;
  s=l>0.5?d/(2-max-min):d/(max+min);
  switch(max){
   case r:h=(g-b)/d+(g<b?6:0);break;
   case g:h=(b-r)/d+2;break;
   default:h=(r-g)/d+4;
  }
  h*=60;
 }

}
function rgbToHsv(r,g,b){
 r/=255;g/=255;b/=255;
 const max=Math.max(r,g,b),min=Math.min(r,g,b),d=max-min;
 let h;
 if(d===0)h=0;
 else if(max===r)h=60*(((g-b)/d)%6);
 else if(max===g)h=60*((b-r)/d+2);
 else h=60*((r-g)/d+4);

 const s=max===0?0:d/max, v=max;
 return [h,s*100,v*100];
}
function hslToRgb(h,s,l){

 if(s===0){const v=Math.round(l*255);return [v,v,v]}

 if(h<60){r=c;g=x;b=0}else if(h<120){r=x;g=c;b=0}else if(h<180){r=0;g=c;b=x}
 else if(h<240){r=0;g=x;b=c}else if(h<300){r=x;g=0;b=c}else{r=c;g=0;b=x}
 return [Math.round((r+m)*255),Math.round((g+m)*255),Math.round((b+m)*255)];
}
function applySingleColorFilter(r,g,b,targetHex){
 // 単色フィルター: 元の画素の「明るさ」を、指定色を通るトーンカーブに写す。
 //  ・明るさ0(黒) → 黒 / 中間の明るさ → ちょうど指定色 / 明るさ最大(白) → 白
 //  ・明るさは HSLの明度 L=(max+min)/2 で測る。
 //    (以前の 0.299R+0.587G+0.114B という人間の目の感度による輝度だと、
 //     彩度の高い青は0.114しか効かず「暗い」と判定され、赤などにすると黒潰れしていた)
 //  ・これにより 暗い青→暗い赤 / 明るい青→明るい赤 のように、色相が変わっても
 //    元の画素の明暗がそのまま保たれる。灰色の場合は従来と同じ結果になる。
 const [tr,tg,tb]=hexToRgb(targetHex);
 const L=(Math.max(r,g,b)+Math.min(r,g,b))/2, P=127.5;
 if(L<=P){
  const k=L/P;
  return [tr*k,tg*k,tb*k];
 }
 const k=(L-P)/(255-P);
 return [tr+(255-tr)*k,tg+(255-tg)*k,tb+(255-tb)*k];
}

 if(e.target.value==="")return;
 const v=Math.max(0,Math.min(100,Math.round(+e.target.value)));
 if(!isFinite(v))return;
 $("selOpacity").value=v;applySelOpacity(v);
};
$("selOpacityVal").onchange=e=>{
 let v=Math.round(+e.target.value);if(!isFinite(v))v=100;
 v=Math.max(0,Math.min(100,v));
 e.target.value=v;$("selOpacity").value=v;applySelOpacity(v);finishSelOpacity();
};
function modifySelection(outside){
 if(!selection||!ensureImage())return;closeOpacityPanel();const im=images[current];pushHistory(im);recordGroup([im]);const x=im.canvas.getContext("2d"),d=x.getImageData(0,0,im.canvas.width,im.canvas.height);
 for(let y=0;y<im.canvas.height;y++)for(let xx=0;xx<im.canvas.width;xx++){const inside=xx>=selection.x&&xx<selection.x+selection.w&&y>=selection.y&&y<selection.y+selection.h;if(inside!==outside)d.data[(y*im.canvas.width+xx)*4+3]=0}
 x.putImageData(d,0,0);updateThumb(im);render();refreshOrder();
}
// 選択範囲だけを完全に削除(透明化)する。履歴は1操作として記録する。
function deleteSelectedArea(){
 if(floating){
  discardFloating();
  $("status").textContent="貼り付け中の選択範囲を削除しました";
  if(window.__syncMobileSelectionButtons)window.__syncMobileSelectionButtons();
  return true;
 }
 if(!hasRange()||!ensureImage())return false;
 closeOpacityPanel();
 const im=images[current],r=getRegion(im.canvas);
 if(!r||!r.w||!r.h)return false;
 pushHistory(im);recordGroup([im]);
 im.canvas.getContext("2d").clearRect(r.x,r.y,r.w,r.h);
 im.modified=true;updateThumb(im);render();refreshOrder();
 if(window.__syncMobileSelectionButtons)window.__syncMobileSelectionButtons();
 $("status").textContent=`選択範囲 ${r.w}×${r.h}px を削除しました`;
 return true;
}
// 貼り付けた絵は「浮いた状態」で保持し、位置が確定するまで下の絵は消さない。
// 確定(外側クリック・Enter・確定ボタン・ツール/画像切替など)した時に、その位置の真上へ張り付ける。
function commitFloating(){
 const f=floating;if(!f)return;
 floating=null;floatDrag=null;
 const im=f.im;
 if(!images.includes(im)){hideFloat();return}
 pushHistory(im);recordGroup([im]);
 im.canvas.getContext("2d").drawImage(f.piece,f.x,f.y);
 im.modified=true;updateThumb(im);
 if(im===images[current]){selection={x:f.x,y:f.y,w:f.w,h:f.h};render()}
 $("status").textContent="貼り付けを確定しました";
 refreshOrder();
}
function discardFloating(){
 if(!floating)return;
 floating=null;floatDrag=null;selection=null;hideFloat();render();
}
function pasteClipboard(){
 // コピー元は「コピーした瞬間」のスナップショットだけを使用する。
 // ここで現在のキャンバスや、直前に貼り付けた floating を読み直さない。
 const source=clipboardSnapshotData?canvasFromState({w:clipboardSnapshotData.w,h:clipboardSnapshotData.h,data:clipboardSnapshotData.data}):((clipboardSnapshot||clipboard)?cloneCanvas(clipboardSnapshot||clipboard):null);
 if(!source||!ensureImage())return;
 // 重要: コピー元を完全に独立したCanvasへ確保してから、前回の貼り付けを確定する。
 // これにより「前回貼り付けたもの＋選択範囲」が次の貼り付け元へ混入しない。
 const frozenSource=cloneCanvas(source);
 endLiveSession();commitFloating();abortSelMove();
 const im=images[current],w=frozenSource.width,h=frozenSource.height;
 let x,y;
 if(lastCanvasPos){x=Math.round(lastCanvasPos.x-w/2);y=Math.round(lastCanvasPos.y-h/2)}
 else if(clipboardOrigin){x=clipboardOrigin.x;y=clipboardOrigin.y}
 else{x=0;y=0}
 x=w>=im.canvas.width?0:Math.max(0,Math.min(im.canvas.width-w,x));
 y=h>=im.canvas.height?0:Math.max(0,Math.min(im.canvas.height-h,y));
 floating={im,piece:frozenSource,x,y,w,h};
 selection={x,y,w,h};tool="select";document.querySelectorAll("[data-tool]").forEach(b=>b.classList.toggle("active",b.dataset.tool==="select"));setupTool();
 $("status").textContent="貼り付け中: ドラッグで移動 → 外側クリック/Enter/確定ボタンで確定 (Escでキャンセル)";
 render();
 $("status").textContent="貼り付け中: ドラッグで移動 → 外側クリック/Enter/確定ボタンで確定 (Escでキャンセル)";
}

let spacePressed=false,panning=false,panStart=null,panScrollStart=null;
window.addEventListener("keydown",e=>{
 if(document.querySelector(".ui-overlay"))return;
 if(e.code==="Space"&&(e.target&&["input","select","textarea"].includes((e.target.tagName||"").toLowerCase())))return;
 if(e.code==="Space"){e.preventDefault();if(!spacePressed){spacePressed=true;wrap.style.cursor="grab"}}
});
window.addEventListener("keyup",e=>{if(e.code==="Space"){spacePressed=false;if(!panning)wrap.style.cursor=""}});
wrap.addEventListener("pointerdown",e=>{
 if(e.button===1||spacePressed){
  e.preventDefault();
  panning=true;panStart={x:e.clientX,y:e.clientY};panScrollStart={left:wrap.scrollLeft,top:wrap.scrollTop};
  wrap.setPointerCapture(e.pointerId);wrap.style.cursor="grabbing";
 }
});
wrap.addEventListener("pointermove",e=>{
 if(panning){
  wrap.scrollLeft=panScrollStart.left-(e.clientX-panStart.x);
  wrap.scrollTop=panScrollStart.top-(e.clientY-panStart.y);
 }
});
window.addEventListener("pointerup",e=>{
 if(panning){panning=false;wrap.style.cursor=spacePressed?"grab":""}
});
wrap.addEventListener("scroll",()=>{pinStatus();if(selection)updateSelectionBox();updateResizeHandles()});

function undoCore(){
 if(globalUndoStack.length){
  const group=globalUndoStack.pop();
  let did=false;
  group.forEach(im=>{
   if(!im||!im.history||!im.history.length)return;
   im.redo=im.redo||[];im.redo.push({w:im.canvas.width,h:im.canvas.height,data:ctxData(im.canvas),texts:im.texts?JSON.parse(JSON.stringify(im.texts)):[]});
   const s=im.history.pop();loadState(im,s);updateThumb(im);did=true;
  });
  if(did)globalRedoStack.push(group);
  rebuildList();render();
  return;
 }
 // フォールバック: グループ記録が無い古い状態でも、現在の画像だけは元に戻せるようにする
 if(!ensureImage())return;const im=images[current];if(!im.history.length)return;
 im.redo=im.redo||[];im.redo.push({w:im.canvas.width,h:im.canvas.height,data:ctxData(im.canvas),texts:im.texts?JSON.parse(JSON.stringify(im.texts)):[]});
 const s=im.history.pop();loadState(im,s);updateThumb(im);
 rebuildList();
}
function redoCore(){
 if(globalRedoStack.length){
  const group=globalRedoStack.pop();
  let did=false;
  group.forEach(im=>{
   if(!im||!im.redo||!im.redo.length)return;
   im.history.push({w:im.canvas.width,h:im.canvas.height,data:ctxData(im.canvas),texts:im.texts?JSON.parse(JSON.stringify(im.texts)):[]});
   const s=im.redo.pop();loadState(im,s);updateThumb(im);did=true;
  });
  if(did)globalUndoStack.push(group);
  rebuildList();render();
  return;
 }
 if(!ensureImage())return;const im=images[current];if(!im.redo||!im.redo.length)return;
 im.history.push({w:im.canvas.width,h:im.canvas.height,data:ctxData(im.canvas),texts:im.texts?JSON.parse(JSON.stringify(im.texts)):[]});
 const s=im.redo.pop();loadState(im,s);updateThumb(im);
 rebuildList();
}
function undo(){if(floating){discardFloating();return}finalizeFontPropertyEdit();undoCore();syncLiveAfterHistory()}
function redo(){if(floating)return;finalizeFontPropertyEdit();redoCore();syncLiveAfterHistory()}
$("undoBtn").onclick=undo;
$("redoBtn").onclick=redo;

function handleShortcut(e){
 if(document.querySelector(".ui-overlay"))return; // ダイアログ表示中は画像編集のショートカットを無効にする
 if(e.key==="Escape"&&rowDrag){e.preventDefault();cancelRowDrag();return}
 const tag=(e.target&&e.target.tagName||"").toLowerCase();
 const typing=tag==="textarea"||(tag==="input"&&!["range","color","checkbox","button"].includes(e.target.type));
 const meta=e.ctrlKey||e.metaKey;
 if(meta&&!e.shiftKey&&e.key.toLowerCase()==="f"){e.preventDefault();focusSearch();return}
 // バー(range)や色選択にフォーカスがある時もCtrl+Z/Ctrl+Yで元に戻せるようにする
 if(!typing&&meta&&e.key.toLowerCase()==="z"&&!e.shiftKey){e.preventDefault();undo();return}
 if(!typing&&meta&&(e.key.toLowerCase()==="y"||(e.shiftKey&&e.key.toLowerCase()==="z"))){e.preventDefault();redo();return}
 if(tag==="input"||tag==="select"||tag==="textarea")return;
 if(meta&&e.key.toLowerCase()==="z"&&!e.shiftKey){e.preventDefault();undo();return}
 if(meta&&(e.key.toLowerCase()==="y"||(e.shiftKey&&e.key.toLowerCase()==="z"))){e.preventDefault();redo();return}
  if(meta&&e.key.toLowerCase()==="c"){
   if(selectedText){e.preventDefault();copySelectedFont();return}
   if(selection){e.preventDefault();commitFloating();$("copySel").click();return}
  }
  if(meta&&e.key.toLowerCase()==="v"){
   if(fontClipboard){e.preventDefault();pasteFontClipboard();return}
   if(clipboard){e.preventDefault();pasteClipboard();return}
  }
 if(meta&&e.key.toLowerCase()==="a"){
  if(ensureImage()){
   e.preventDefault();
    finalizeFontPropertyEdit();
   commitFloating();
   abortSelMove();
   selectedText=null;
   tool="select";document.querySelectorAll("[data-tool]").forEach(b=>b.classList.toggle("active",b.dataset.tool==="select"));setupTool();
   const im=images[current];
   selection={x:0,y:0,w:im.canvas.width,h:im.canvas.height};
   updateSelectionBox();render();
  }
  return;
 }
 if(e.key==="Enter"&&floating){e.preventDefault();commitFloating();return}
 if(e.key==="Escape"){if(floating){discardFloating();return}abortSelMove();if(selectedText){finalizeFontPropertyEdit();selectedText=null;selection=null;tool="select";document.querySelectorAll("[data-tool]").forEach(b=>b.classList.toggle("active",b.dataset.tool==="select"));setupTool();render();return}if(selection){selection=null;hideFloat();render()}return}
 if((e.key==="Delete"||e.key==="Backspace")&&floating){e.preventDefault();discardFloating();return}
 if((e.key==="Delete"||e.key==="Backspace")&&selectedText&&ensureImage()){
   e.preventDefault();finalizeFontPropertyEdit();
  const im=images[current],i=im.texts.indexOf(selectedText);if(i>=0){pushHistory(im);recordGroup([im]);im.texts.splice(i,1);selectedText=null;selection=null;render();updateThumb(im);rebuildList()}return;
 }
 if((e.key==="Delete"||e.key==="Backspace")&&selection&&ensureImage()){e.preventDefault();modifySelection(false);return}
}
window.addEventListener("keydown",handleShortcut,true);
window.addEventListener("load",()=>document.body.focus());
document.body.focus();

function downloadBlob(blob,name){const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
$("downloadZip").onclick=async()=>{
 if(!images.length){alert("画像がありません。");return}
 commitFloating();
 const z=new JSZip();
 await Promise.all(images.map(async im=>new Promise(resolve=>{
   const out=cloneCanvas(im.canvas),oc=out.getContext("2d");drawTextLayers(oc,im);
   out.toBlob(b=>{
   const path=im.folder?`${im.folder}/${im.name}`:im.name;
   z.file(path,b);resolve()
 }, "image/png");})));
 const blob=await z.generateAsync({type:"blob",compression:"DEFLATE"});downloadBlob(blob,"texture-studio-export.zip");dirty=false;
};

// 編集中(未保存の変更がある)ときにタブ/ウィンドウを閉じようとしたら確認を出す
//  (確認画面の見た目・文言はブラウザ標準のもので、アプリ側では変えられません)
window.addEventListener("beforeunload",e=>{
 if(!dirty||!images.length)return;
 e.preventDefault();
 e.returnValue="";
 return "";
});

setupTool();render();


// --- モバイル/タブレット用: 画像プレビュー固定ペーストボタン ---
(function setupMobilePasteButton(){
  const wrapEl=document.querySelector(".canvas-wrap");
  if(!wrapEl)return;
  const actions=document.createElement("div");
  actions.className="mobile-action-buttons";

  const del=document.createElement("button");
  del.type="button";
  del.className="mobile-delete-button";
  del.textContent="削除";
  del.title="選択範囲だけを削除します";
  del.addEventListener("click",()=>{
    if(typeof deleteSelectedArea==="function")deleteSelectedArea();
    sync();
  });

  const btn=document.createElement("button");
  btn.type="button";
  btn.className="mobile-paste-button";
  btn.textContent="貼り付け";
  btn.title="コピーした内容を貼り付けます";
  btn.addEventListener("click",()=>{
    if(window.__mobileLastCopyType==="font"&&typeof pasteFontClipboard==="function"){
      pasteFontClipboard();
    }else if(typeof pasteClipboard==="function"){
      pasteClipboard();
    }
    sync();
  });

  actions.append(del,btn);
  wrapEl.appendChild(actions);

  const mq=window.matchMedia("(max-width:1100px)");
  const sync=()=>{
    const visible=mq.matches;
    const hasSelection=typeof hasRange==="function"&&hasRange()&&!selecting&&!selectedText;
    const hasFloating=!!floating;
    const hasImageClipboard=typeof clipboard!=="undefined"&&!!clipboard;
    const hasFontClipboard=typeof fontClipboard!=="undefined"&&!!fontClipboard;
    const hasClipboard=hasImageClipboard||hasFontClipboard;

    actions.style.display=visible&&(hasSelection||hasFloating||hasClipboard)?"flex":"none";
    del.style.display=visible&&hasSelection?"block":"none";
    btn.style.display=visible&&hasClipboard?"block":"none";
    del.disabled=false;
    btn.disabled=false;
  };

  const pinActions=()=>{actions.style.transform=`translate(${wrapEl.scrollLeft}px,${wrapEl.scrollTop}px)`};
  wrapEl.addEventListener("scroll",pinActions,{passive:true});
  window.addEventListener("resize",pinActions);
  pinActions();
  window.__syncMobilePasteButton=sync;
  window.__syncMobileSelectionButtons=sync;
  sync();
})();

// --- モバイル用: 画像一覧ドロワー ---
(function setupMobileSidebar(){
  const sidebar=document.querySelector(".sidebar");
  const workspace=document.querySelector(".workspace");
  if(!sidebar||!workspace)return;
  const toggle=document.createElement("button");
  toggle.type="button";
  toggle.className="mobile-sidebar-toggle";
  toggle.textContent="☰ 画像一覧";
  toggle.setAttribute("aria-label","画像一覧を開く");
  workspace.appendChild(toggle);
  const mq=window.matchMedia("(max-width:700px)");
  const sync=()=>{
    if(!mq.matches){sidebar.classList.remove("mobile-open");toggle.classList.remove("is-open");toggle.style.display="none";return}
    toggle.style.display="block";
    toggle.classList.toggle("is-open",sidebar.classList.contains("mobile-open"));
    toggle.textContent=sidebar.classList.contains("mobile-open")?"‹ 閉じる":"☰ 画像一覧";
  };
  const close=()=>{sidebar.classList.remove("mobile-open");sync()};
  toggle.addEventListener("click",()=>{sidebar.classList.toggle("mobile-open");sync()});
  const head=sidebar.querySelector(".sidebar-head");
  if(head)head.addEventListener("click",e=>{
    if(!mq.matches||e.target.closest("input"))return;
    sidebar.classList.toggle("mobile-open");sync();
  });
  fileList.addEventListener("click",e=>{if(mq.matches&&e.target.closest(".thumb"))close()});
  mq.addEventListener?.("change",sync);
  sync();
})();
